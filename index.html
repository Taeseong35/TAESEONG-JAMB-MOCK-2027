
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAESEONG JAMB MOCK 2027</title>
<style>
:root {
  --navy:#07152e;
  --gold:#e8b94f;
  --white:#ffffff;
  --light:#f2f5fa;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:#17243b;
}
header{
  background:var(--navy);
  color:white;
  padding:25px 15px;
  text-align:center;
  border-bottom:4px solid var(--gold);
}
header h1{color:var(--gold);margin:0 0 8px}
header p{margin:0;color:#dce5f4}
.container{
  max-width:850px;
  margin:25px auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:22px;
  box-shadow:0 3px 15px #00000012;
  margin-bottom:18px;
}
h2{color:var(--navy)}
input,select{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #ccd3df;
  border-radius:7px;
  font-size:16px;
}
button{
  background:var(--navy);
  color:white;
  padding:12px 20px;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-size:15px;
  margin:5px;
}
button:hover{background:#17345e}
.gold{background:var(--gold);color:var(--navy);font-weight:bold}
.gold:hover{background:#d6a638}
.hidden{display:none}
.topline{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-weight:bold;
}
.timer{color:#b12b2b}
.option{
  display:block;
  padding:13px;
  border:1px solid #dce1e9;
  border-radius:7px;
  margin:10px 0;
  cursor:pointer;
}
.option:has(input:checked){
  background:#fff5d9;
  border-color:var(--gold);
}
.option input{width:auto;margin:0 8px 0 0}
.navigation{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-top:20px;
}
#questionNumbers{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px;
  margin-top:15px;
}
.qnumber{
  padding:9px 3px;
  background:#e8edf5;
  color:var(--navy);
}
.qnumber.answered{background:#d7edda}
footer{text-align:center;padding:20px;color:#667}
</style>
</head>
<body>

<header>
<h1>TAESEONG</h1>
<h2 style="color:white">JAMB MOCK 2027</h2>
<p>Excellence • Discipline • Success</p>
</header>

<main class="container">

<section id="welcome" class="card">
<h2>Welcome to TAESEONG JAMB MOCK</h2>
<p>Prepare for your 2027 UTME with our computer-based practice platform.</p>

<label>Candidate's Name</label>
<input id="candidate" placeholder="Enter your full name">

<label>Select Subject Combination</label>
<select id="combination">
<option value="science">Science: English, Mathematics, Physics, Chemistry</option>
</select>

<button class="gold" onclick="startExam()">START EXAMINATION</button>
</section>

<section id="exam" class="card hidden">
<div class="topline">
<span id="subjectName">English</span>
<span class="timer" id="timer">02:00:00</span>
</div>
<hr>
<p id="progress"></p>
<h3 id="question"></h3>
<div id="options"></div>

<div class="navigation">
<button onclick="previousQuestion()">Previous</button>
<button class="gold" onclick="nextQuestion()">Next</button>
</div>

<h3>Question Navigator</h3>
<div id="questionNumbers"></div>
<br>
<button class="gold" onclick="submitExam()">SUBMIT EXAMINATION</button>
</section>

<section id="result" class="card hidden">
<h2>Examination Completed</h2>
<h3 id="resultName"></h3>
<p id="score"></p>
<p id="percentage"></p>
<p id="remark"></p>
<button onclick="location.reload()">TAKE ANOTHER MOCK</button>
</section>

</main>

<footer>
TAESEONG JAMB MOCK 2027 | Independent CBT Practice Platform
</footer>

<script>
const subjects = [
{
name:"English Language",
questions:[
{q:"Choose the word nearest in meaning to RAPID.",a:["Slow","Quick","Weak","Late"],c:1},
{q:"The opposite of ANCIENT is ____.",a:["Old","Modern","Past","Historic"],c:1},
{q:"Which is a noun?",a:["Beautiful","Run","Happiness","Quickly"],c:2},
{q:"Choose the correct spelling.",a:["Accomodation","Accommodation","Acommodation","Acomodation"],c:1},
{q:"The plural of criterion is ____.",a:["Criterions","Criteria","Criterias","Criterion"],c:1}
]
},
{
name:"Mathematics",
questions:[
{q:"Solve: 2x + 6 = 14.",a:["2","3","4","5"],c:2},
{q:"Find the value of 5².",a:["10","15","20","25"],c:3},
{q:"What is the square root of 144?",a:["10","11","12","14"],c:2},
{q:"Evaluate 3/4 + 1/4.",a:["1/2","1","2","3/4"],c:1},
{q:"Find the area of a rectangle of length 8 cm and width 5 cm.",a:["13 cm²","26 cm²","40 cm²","45 cm²"],c:2}
]
},
{
name:"Physics",
questions:[
{q:"What is the SI unit of force?",a:["Joule","Newton","Watt","Pascal"],c:1},
{q:"Which instrument measures electric current?",a:["Voltmeter","Ammeter","Barometer","Thermometer"],c:1},
{q:"What is the speed of light in vacuum approximately?",a:["3 × 10⁶ m/s","3 × 10⁸ m/s","3 × 10⁵ m/s","3 × 10⁷ m/s"],c:1},
{q:"Which energy does a moving body possess?",a:["Potential","Chemical","Kinetic","Nuclear"],c:2},
{q:"Which wave requires a material medium?",a:["Light","Radio","Sound","X-ray"],c:2}
]
},
{
name:"Chemistry",
questions:[
{q:"What is the chemical symbol for sodium?",a:["S","So","Na","N"],c:2},
{q:"The atomic number of carbon is ____.",a:["4","6","8","12"],c:1},
{q:"Which gas supports combustion?",a:["Nitrogen","Oxygen","Carbon dioxide","Hydrogen"],c:1},
{q:"What is the pH of a neutral solution at 25°C?",a:["0","5","7","14"],c:2},
{q:"What type of bond exists in sodium chloride?",a:["Covalent","Metallic","Ionic","Hydrogen"],c:2}
]
}
];

let allQuestions=[];
let answers={};
let current=0;
let seconds=7200;
let interval;

function startExam(){
const name=document.getElementById("candidate").value.trim();
if(!name){alert("Please enter your name.");return;}
allQuestions=[];
subjects.forEach(s=>{
s.questions.forEach(q=>{
allQuestions.push({...q,subject:s.name});
});
});
document.getElementById("welcome").classList.add("hidden");
document.getElementById("exam").classList.remove("hidden");
showQuestion();
interval=setInterval(()=>{
seconds--;
let h=String(Math.floor(seconds/3600)).padStart(2,"0");
let m=String(Math.floor(seconds%3600/60)).padStart(2,"0");
let s=String(seconds%60).padStart(2,"0");
document.getElementById("timer").textContent=`${h}:${m}:${s}`;
if(seconds<=0)submitExam();
},1000);
}

function showQuestion(){
let q=allQuestions[current];
document.getElementById("subjectName").textContent=q.subject;
document.getElementById("progress").textContent=`Question ${current+1} of ${allQuestions.length}`;
document.getElementById("question").textContent=q.q;
document.getElementById("options").innerHTML=q.a.map((a,i)=>`
<label class="option">
<input type="radio" name="answer" value="${i}" ${answers[current]===i?"checked":""} onchange="saveAnswer(${i})">
${String.fromCharCode(65+i)}. ${a}
</label>`).join("");
renderNumbers();
}

function saveAnswer(i){
answers[current]=i;
renderNumbers();
}

function renderNumbers(){
document.getElementById("questionNumbers").innerHTML=allQuestions.map((q,i)=>
`<button class="qnumber ${answers[i]!==undefined?"answered":""}" onclick="goTo(${i})">${i+1}</button>`
).join("");
}

function goTo(i){current=i;showQuestion();}
function nextQuestion(){if(current<allQuestions.length-1){current++;showQuestion();}}
function previousQuestion(){if(current>0){current--;showQuestion();}}

function submitExam(){
if(!document.getElementById("exam").classList.contains("hidden")){
if(!confirm("Are you sure you want to submit?"))return;
}
clearInterval(interval);
let score=0;
allQuestions.forEach((q,i)=>{if(answers[i]===q.c)score++;});
let percent=Math.round(score/allQuestions.length*100);
document.getElementById("exam").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");
document.getElementById("resultName").textContent="Candidate: "+document.getElementById("candidate").value;
document.getElementById("score").textContent=`Your score: ${score} / ${allQuestions.length}`;
document.getElementById("percentage").textContent=`Percentage: ${percent}%`;
document.getElementById("remark").textContent=percent>=70?"Excellent performance!":percent>=50?"Good effort. Keep practising!":"Keep studying and try again.";
}
</script>
</body>
</html>
